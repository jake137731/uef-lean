name: Check the UEF in Lean
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Lean
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Mathlib
        run: lake exe cache get
      - name: Check every theorem
        run: |
          set -o pipefail
          lake build 2>&1 | tee build.log
          lake env lean Axioms.lean 2>&1 | tee -a build.log
      - name: Keep the log
        if: always()
        run: |
          mkdir -p /tmp/log && cp build.log /tmp/log/ 2>/dev/null || echo "no build log" > /tmp/log/build.log
          cd /tmp/log && git init -q && git checkout -q -b check-log
          git config user.name "UEF check" && git config user.email "actions@github.com"
          git add build.log && git commit -q -m "Check log ${GITHUB_RUN_ID}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" check-log
